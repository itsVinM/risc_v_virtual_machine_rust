[package]
name = "risc_v_virtual_machine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "riscv-vm"
path = "src/main.rs"

[lib]
name = "riscv_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = 3
lto = true
